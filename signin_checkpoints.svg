<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="The six checkpoints of a sign-in and the error codes each one produces">
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.k{animation:i .6s ease-out both}@keyframes i{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
<rect width="1000" height="560" rx="14" fill="#0b1b33"/>
<text x="25" y="40" font-size="19" font-weight="700" fill="#fff">Where a sign-in can fail</text>
<text x="25" y="62" font-size="13" fill="#8fb3dd">Every sign-in passes six checkpoints in order. The error code tells you which one stopped it.</text>
<g class="k" style="animation-delay:0.0s"><rect x="25" y="84" width="300" height="206" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="25" y="84" width="300" height="4" rx="2" fill="#3987e5"/><circle cx="55" cy="120" r="15" fill="#3987e5"/><text x="55" y="126" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="81" y="118" font-size="16" font-weight="700" fill="#fff">Find the user</text><text x="81" y="136" font-size="12" fill="#8fb3dd">Does this account exist here?</text>
<text x="45" y="170" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50034</tspan>  not found</text>
<text x="45" y="192" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50020</tspan>  wrong tenant</text>
<text x="45" y="214" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">90072</tspan>  guest not invited</text>
<rect x="45" y="254" width="132" height="24" rx="12" fill="#3987e5" fill-opacity=".2"/><text x="57" y="271" font-size="12" font-weight="600" fill="#fff">Scenarios 1, 22</text></g>
<path d="M328,187.0 h17" stroke="#5b7aa6" stroke-width="2"/><path d="M340,182.0 l6,5 l-6,5" fill="none" stroke="#5b7aa6" stroke-width="2"/>
<g class="k" style="animation-delay:0.1s"><rect x="350" y="84" width="300" height="206" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="350" y="84" width="300" height="4" rx="2" fill="#3987e5"/><circle cx="380" cy="120" r="15" fill="#3987e5"/><text x="380" y="126" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="406" y="118" font-size="16" font-weight="700" fill="#fff">Check the password</text><text x="406" y="136" font-size="12" fill="#8fb3dd">Right credential, account usable?</text>
<text x="370" y="170" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50126</tspan>  wrong password</text>
<text x="370" y="192" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50053</tspan>  locked</text>
<text x="370" y="214" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50055</tspan>  expired</text>
<text x="370" y="236" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50057</tspan>  disabled</text>
<rect x="370" y="254" width="125" height="24" rx="12" fill="#3987e5" fill-opacity=".2"/><text x="382" y="271" font-size="12" font-weight="600" fill="#fff">Scenarios 1, 5</text></g>
<path d="M653,187.0 h17" stroke="#5b7aa6" stroke-width="2"/><path d="M665,182.0 l6,5 l-6,5" fill="none" stroke="#5b7aa6" stroke-width="2"/>
<g class="k" style="animation-delay:0.2s"><rect x="675" y="84" width="300" height="206" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="675" y="84" width="300" height="4" rx="2" fill="#9085e9"/><circle cx="705" cy="120" r="15" fill="#9085e9"/><text x="705" y="126" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="731" y="118" font-size="16" font-weight="700" fill="#fff">Second factor</text><text x="731" y="136" font-size="12" fill="#8fb3dd">Did MFA complete?</text>
<text x="695" y="170" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50074</tspan>  not completed</text>
<text x="695" y="192" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">500121</tspan>  failed</text>
<text x="695" y="214" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50072</tspan>  not registered</text>
<text x="695" y="236" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50158</tspan>  external MFA</text>
<rect x="695" y="254" width="96" height="24" rx="12" fill="#9085e9" fill-opacity=".2"/><text x="707" y="271" font-size="12" font-weight="600" fill="#fff">Scenario 2</text></g>
<g class="k" style="animation-delay:0.3s"><rect x="25" y="314" width="300" height="206" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="25" y="314" width="300" height="4" rx="2" fill="#d95926"/><circle cx="55" cy="350" r="15" fill="#d95926"/><text x="55" y="356" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="81" y="348" font-size="16" font-weight="700" fill="#fff">Device</text><text x="81" y="366" font-size="12" fill="#8fb3dd">Known, joined, compliant?</text>
<text x="45" y="400" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">53000</tspan>  not compliant</text>
<text x="45" y="422" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">53001</tspan>  not joined</text>
<text x="45" y="444" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50155</tspan>  device auth failed</text>
<text x="45" y="466" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">135011</tspan>  disabled</text>
<rect x="45" y="484" width="139" height="24" rx="12" fill="#d95926" fill-opacity=".2"/><text x="57" y="501" font-size="12" font-weight="600" fill="#fff">Scenarios 14, 15</text></g>
<path d="M328,417.0 h17" stroke="#5b7aa6" stroke-width="2"/><path d="M340,412.0 l6,5 l-6,5" fill="none" stroke="#5b7aa6" stroke-width="2"/>
<g class="k" style="animation-delay:0.4s"><rect x="350" y="314" width="300" height="206" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="350" y="314" width="300" height="4" rx="2" fill="#d95926"/><circle cx="380" cy="350" r="15" fill="#d95926"/><text x="380" y="356" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="406" y="348" font-size="16" font-weight="700" fill="#fff">Conditional Access</text><text x="406" y="366" font-size="12" fill="#8fb3dd">Do the policies allow it?</text>
<text x="370" y="400" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">53003</tspan>  blocked</text>
<text x="370" y="422" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">530032</tspan>  security policy</text>
<text x="370" y="444" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">70043</tspan>  sign-in frequency</text>
<text x="370" y="466" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">53004</tspan>  risk blocks sign-up</text>
<rect x="370" y="484" width="146" height="24" rx="12" fill="#d95926" fill-opacity=".2"/><text x="382" y="501" font-size="12" font-weight="600" fill="#fff">Scenarios 3, 4, 6</text></g>
<path d="M653,417.0 h17" stroke="#5b7aa6" stroke-width="2"/><path d="M665,412.0 l6,5 l-6,5" fill="none" stroke="#5b7aa6" stroke-width="2"/>
<g class="k" style="animation-delay:0.5s"><rect x="675" y="314" width="300" height="206" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="675" y="314" width="300" height="4" rx="2" fill="#199e70"/><circle cx="705" cy="350" r="15" fill="#199e70"/><text x="705" y="356" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="731" y="348" font-size="16" font-weight="700" fill="#fff">The application</text><text x="731" y="366" font-size="12" fill="#8fb3dd">Is the app set up for this user?</text>
<text x="695" y="400" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50105</tspan>  not assigned</text>
<text x="695" y="422" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">65001</tspan>  no consent</text>
<text x="695" y="444" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">50011</tspan>  reply URL</text>
<text x="695" y="466" font-size="13" fill="#cfe3ff"><tspan font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,Consolas,monospace">7000222</tspan>  secret expired</text>
<rect x="695" y="484" width="125" height="24" rx="12" fill="#199e70" fill-opacity=".2"/><text x="707" y="501" font-size="12" font-weight="600" fill="#fff">Scenarios 7–10</text></g>
</svg>