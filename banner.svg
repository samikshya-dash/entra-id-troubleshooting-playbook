<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Microsoft Entra ID troubleshooting playbook">
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#0b1b33'/><stop offset='1' stop-color='#14325c'/></linearGradient><linearGradient id='ln' x1='0' x2='1'><stop offset='0' stop-color='#4fd1c5'/><stop offset='1' stop-color='#63b3ed'/></linearGradient>
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.a{animation:u .8s ease-out both}.b{animation:u .8s .2s ease-out both}.c{animation:u .8s .4s ease-out both}@keyframes u{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.p{animation:pl 2.4s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.45}50%{opacity:1}}</style></defs>
<rect width="1000" height="220" rx="14" fill="url(#bg)"/>
<text class="a" x="44" y="80" font-size="34" font-weight="700" fill="#fff">Microsoft Entra ID troubleshooting playbook</text>
<rect class="b" x="44" y="96" width="130" height="4" rx="2" fill="url(#ln)"/>
<text class="b" x="44" y="134" font-size="17" fill="#cfe3ff">From the error on screen to the cause and the fix, in the fewest steps</text>
<g class="c"><rect x="44" y="160" width="137" height="36" rx="18" fill="#10233f" stroke="#2a4f80"/><text x="60" y="184" font-size="16" font-weight="700" fill="#4fd1c5">24</text><text x="88" y="184" font-size="13.5" fill="#cfe3ff">scenarios</text></g>
<g class="c"><rect x="192.60000000000002" y="160" width="224" height="36" rx="18" fill="#10233f" stroke="#2a4f80"/><text x="208.60000000000002" y="184" font-size="16" font-weight="700" fill="#4fd1c5">80+</text><text x="247.60000000000002" y="184" font-size="13.5" fill="#cfe3ff">codes and event IDs</text></g>
<g class="c"><rect x="428.20000000000005" y="160" width="248" height="36" rx="18" fill="#10233f" stroke="#2a4f80"/><text x="444.20000000000005" y="184" font-size="16" font-weight="700" fill="#4fd1c5">22</text><text x="472.20000000000005" y="184" font-size="13.5" fill="#cfe3ff">ready-to-run KQL queries</text></g>
<g class="c"><rect x="687.8000000000001" y="160" width="153" height="36" rx="18" fill="#10233f" stroke="#2a4f80"/><text x="703.8000000000001" y="184" font-size="16" font-weight="700" fill="#4fd1c5">8</text><text x="720.8000000000001" y="184" font-size="13.5" fill="#cfe3ff">flow diagrams</text></g>
